<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}Blog{% endblock %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body { background: #f8f9fa; }
            .card-hover:hover { transform: translateY(-2px); transition: 0.2s; }
        </style>

        {% load static %}
    </head>

    <body>

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="/">Blog</a>

                <div class="ms-auto">
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' user.username %}" class="text-white me-3">
                            {{ user.username }}
                        </a>

                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}

                            <button type="submit" class="btn btn-sm btn-outline-light">
                                Logout
                            </button>
                        </form>
d
                    {% else %}
                        <a href="/accounts/login/" class="btn btn-sm btn-outline-light me-2">Login</a>
                        <a href="{% url 'register' %}" class="btn btn-sm btn-light">Sign up</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <div class="container">
            {% block content %}{% endblock %}
        </div>

        {% load static %}
        <script src="{% static 'blog/js/votes.js' %}"></script>
        <script src="{% static 'blog/js/comments.js' %}"></script>

    </body>
</html>
